{% extends 'booklibrary/index.html' %}

{% block title %}Добавить книгу{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h2>Новая <em>книга</em></h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label" for="name">Название</label>
                <input id="name" type="text" name="name" value="{{ object.name }}" class="form-control"
                    placeholder="Введите название книги">
            </div>

            <div class="mb-3">
                <label class="form-label" for="author">Автор</label>
                <input id="author" type="text" name="author" value="" class="form-control" placeholder="Имя автора">
            </div>

            <div class="mb-3">
                <label class="form-label" for="file">Файл книги</label>
                <input id="file" type="file" name="file" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label" for="id_category">Категория</label>
                <select name="category" class="form-control select-category" required id="id_category">
                    {% for category in categories.all %}
                    <option slug="{{ category.slug }}" class="categories" value="{{ category.pk }}">{{ category }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="id_subcategory">Подкатегория</label>
                <select name="subcategory" class="form-control" id="id_subcategory" multiple></select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="target_date">Прочитать до</label>
                <input id="target_date" type="date" name="target_date" value="" class="form-control">
            </div>

            {% if reading_list %}
            <div class="mb-3">
                <label class="form-label" for="id_reading_list">Список чтения</label>
                <select name="reading_list" class="form-control select-reading_list" id="id_reading_list">
                    {% for reading_list in reading_list.all %}
                    <option slug="{{ reading_list.slug }}" class="reading_list" value="{{ reading_list.pk }}">{{
                        reading_list }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="mb-3" style="margin-top: 28px;">
                <input type="submit" value="Добавить книгу" class="form-control">
            </div>

            {% if field.errors %}
            <div class="error">{{ field.errors }}</div>
            {% endif %}
        </form>
    </div>
</div>

<script>
    function exec() {
        const current_user = "{{ user }}";
        const selectCategory = document.querySelector('.select-category');
        let slug = selectCategory.options[selectCategory.selectedIndex].getAttribute('slug');
        selectCategory.addEventListener('change', () => {
            slug = selectCategory.options[selectCategory.selectedIndex].getAttribute('slug');
            getSubcategories(current_user, slug);
        });
        getSubcategories(current_user, slug);
    }

    function getSubcategories(current_user, slug) {
        const uploadurl = "/books/getsubcategories/" + slug;
        fetch(uploadurl, { method: "GET" })
            .then(response => response.json())
            .then(subcategories => setSubcategories(subcategories))
            .catch(err => console.error(err));
    }

    function setSubcategories(subcategories) {
        const select = document.getElementById('id_subcategory');
        select.innerHTML = "";
        const size = Object.keys(subcategories).length;
        if (size === 0) {
            const opt = document.createElement('option');
            opt.value = 1;
            opt.innerHTML = "Нет подкатегорий для этой категории";
            select.appendChild(opt);
            return;
        }
        for (let i = 0; i < size; i++) {
            const opt = document.createElement('option');
            opt.value = subcategories[i][0];
            opt.innerHTML = subcategories[i][1];
            select.appendChild(opt);
        }
    }

    window.onload = exec();
</script>
{% endblock %}
